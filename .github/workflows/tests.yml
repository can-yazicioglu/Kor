name: Verify prototype

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install training and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-optional.txt
      - name: Install DOM test dependencies
        run: |
          npm install --global pnpm@12.14.0
          pnpm --dir app install --frozen-lockfile
      - name: Data and model checks
        run: python -m unittest discover -s tests -v
      - name: Static server boundaries
        run: python -m unittest discover -s app/tests -p 'test_*.py' -v
      - name: JavaScript contracts, model and UI checks
        run: pnpm --dir app test
      - name: Verify release checksums and offline runtime readiness
        run: python scripts/preflight.py
      - name: Install Chromium for actual browser checks
        run: pnpm --dir app exec playwright install --with-deps chromium
      - name: Desktop and mobile browser demonstrations
        run: pnpm --dir app test:browser
