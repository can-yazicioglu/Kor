<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ephemeral Login Sentinel</title>
  <desc id="desc">Less identity exposure. More inspectable evidence. A local session-risk prototype with a 120-second observation window, 300-second demo retention and human review.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="12" fill="#142f38"/>
  <rect width="1200" height="420" rx="12" fill="url(#grid)"/>
  <path d="M0 6H1200" stroke="#c7ac65" stroke-width="6"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="42" y="35" width="40" height="42" rx="7" fill="#dae89a"/>
    <path d="M62 43l12 5v9c0 7-7 12-12 15-5-3-12-8-12-15v-9z" fill="none" stroke="#18343d" stroke-width="2"/>
    <path d="m56 56 4 4 8-9" fill="none" stroke="#18343d" stroke-width="2.5"/>
    <text x="97" y="53" fill="#f8f5e9" font-size="17" font-weight="700" letter-spacing="2">SENTINEL</text>
    <text x="97" y="73" fill="#b2c7c9" font-size="12" letter-spacing="1.4">SECURITY DESK / RESEARCH PROTOTYPE</text>
    <text x="42" y="153" fill="#fffdf4" font-family="Georgia, 'Times New Roman', serif" font-size="52">Ephemeral Login</text>
    <text x="42" y="211" fill="#fffdf4" font-family="Georgia, 'Times New Roman', serif" font-size="52">Sentinel.</text>
    <text x="44" y="255" fill="#d8e3de" font-size="20">Less identity exposure. More inspectable evidence.</text>
    <text x="44" y="287" fill="#b2c7c9" font-size="15">Local AI risk analysis with expiring state and human review.</text>
    <g transform="translate(784 96)">
      <rect width="372" height="196" rx="4" fill="#f6f3e9"/>
      <rect width="372" height="30" rx="4" fill="#c7ac65"/>
      <text x="18" y="20" fill="#233942" font-size="11" font-weight="700" letter-spacing="1.4">THE EVIDENCE LIFECYCLE</text>
      <path d="M32 65v95" stroke="#b8c3bd" stroke-width="2"/>
      <g fill="#24434c"><circle cx="32" cy="64" r="6"/><circle cx="32" cy="111" r="6"/><circle cx="32" cy="158" r="6"/></g>
      <g fill="#24434c" font-size="17" font-weight="700"><text x="52" y="66">Observe</text><text x="52" y="113">Explain</text><text x="52" y="160">Expire</text></g>
      <g fill="#536771" font-size="12"><text x="52" y="83">Derived context. Short-lived identifiers.</text><text x="52" y="130">Risk, reasons, and a verification step.</text><text x="52" y="177">Bounded application state. Visible limits.</text></g>
    </g>
    <path d="M42 329H1158" stroke="#60736e" stroke-width="1"/>
    <g fill="#dbe5d2" font-size="13" letter-spacing=".7"><text x="44" y="365">120s OBSERVATION</text><text x="292" y="365">300s DEMO RETENTION</text><text x="580" y="365">NO AUTOMATIC ACCOUNT LOCK</text></g>
    <rect x="1011" y="347" width="145" height="27" rx="3" fill="#dae89a"/><text x="1083" y="365" fill="#243c35" text-anchor="middle" font-size="11" font-weight="700" letter-spacing=".6">SYNTHETIC DEMO</text>
  </g>
</svg>
